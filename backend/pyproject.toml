[project]
name = "insight-suite-backend"
version = "0.1.0"
description = "AI-powered data analysis and dashboard suite"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "duckdb>=1.5.0",
  "wrenai>=0.15",
  "pydantic>=2",
  "pyarrow>=14",
  "pandas>=2",
  "openpyxl>=3.1",
  "sqlglot>=29",
  "python-dotenv>=1.0",
  "mcp>=1.0",
  "openai>=3.19.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
